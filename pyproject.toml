[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "casm-t3"
version = "0.1.0"
description = "CASM T3: candidate plotting, classification and alerting"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "casm-t2",
    "casm_io",
]

[project.scripts]
t3-dump-plotter = "casm_t3.apps.dump_plotter:main"
t3-replot = "casm_t3.apps.replot:main"
t3-janitor = "casm_t3.apps.janitor:main"
t3-web = "casm_t3.web.app:main"
t3-collect = "casm_t3.apps.collect:main"
t3-weights-watch = "casm_t3.apps.weights_watch:main"
t3-replay-injection = "casm_t3.apps.replay_injection:main"

[tool.setuptools.packages.find]
include = ["casm_t3*"]

[tool.setuptools.package-data]
casm_t3 = ["web/templates/*.html"]
